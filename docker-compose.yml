services:
  postgres:
    image: postgres:16-alpine
    container_name: xpertlink-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: xpertlink
      POSTGRES_PASSWORD: xpertlink
      POSTGRES_DB: xpertlink
    volumes:
      - xpertlink_pg_data:/var/lib/postgresql/data

volumes:
  xpertlink_pg_data:
