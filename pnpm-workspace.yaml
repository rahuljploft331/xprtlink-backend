packages:
  - services/*
  - shared

allowBuilds:
  '@firebase/util': true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1115.0'
  - '@aws-sdk/client-secrets-manager@3.1115.0'
  - '@aws-sdk/s3-request-presigner@3.1115.0'
  - '@smithy/core@3.33.3'
  - '@smithy/node-http-handler@4.11.3'

overrides:
  "@aws-sdk/s3-request-presigner@>=3.1109.0 <4.0.0-0": "3.1115.0"
  "@aws-sdk/client-secrets-manager@>=3.1109.0 <4.0.0-0": "3.1115.0"
  "@aws-sdk/client-s3@>=3.1109.0 <4.0.0-0": "3.1115.0"
  "@smithy/node-http-handler@>=4.9.13 <5.0.0-0": "4.11.3"
