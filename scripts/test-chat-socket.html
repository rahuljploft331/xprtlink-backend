<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XprtLink — Dual WebSocket Chat Test (Customer & Expert)</title>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --customer-color: #3b82f6;
      --customer-hover: #2563eb;
      --expert-color: #10b981;
      --expert-hover: #059669;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #23304d;
      --badge-conn: rgba(16, 185, 129, 0.2);
      --badge-conn-text: #34d399;
      --badge-dis: rgba(239, 68, 68, 0.2);
      --badge-dis-text: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; display: flex; flex-direction: column; gap: 16px; }
    
    /* Header */
    .top-header { text-align: center; margin-bottom: 4px; }
    .top-header h1 { font-size: 22px; color: #fff; font-weight: 700; letter-spacing: -0.02em; }
    .top-header p { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

    /* Control Panel */
    .control-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .ctrl-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    input {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      padding: 8px 12px;
      font-size: 13px;
    }
    input:focus { outline: none; border-color: #60a5fa; }
    button {
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button.primary-btn { background: #3b82f6; color: #fff; }
    button.primary-btn:hover { background: #2563eb; }
    button.secondary-btn { background: #243049; color: #cbd5e1; }
    button.secondary-btn:hover { background: #334155; color: #fff; }

    /* Grid Layout */
    .chat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) {
      .chat-grid { grid-template-columns: 1fr; }
    }

    /* Client Cards */
    .client-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
    }
    .card-title.customer { color: #60a5fa; }
    .card-title.expert { color: #34d399; }
    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--badge-dis);
      color: var(--badge-dis-text);
    }
    .status-badge.connected {
      background: var(--badge-conn);
      color: var(--badge-conn-text);
    }

    .token-box {
      font-family: monospace;
      font-size: 11px;
      width: 100%;
    }

    .chat-area {
      height: 320px;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg-bubble {
      max-width: 78%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg-bubble.mine-cust {
      align-self: flex-end;
      background: #1d4ed8;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .msg-bubble.mine-exp {
      align-self: flex-end;
      background: #047857;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .msg-bubble.theirs {
      align-self: flex-start;
      background: #1e293b;
      color: #e2e8f0;
      border-bottom-left-radius: 2px;
    }
    .msg-meta {
      font-size: 10px;
      opacity: 0.75;
      margin-top: 3px;
      text-align: right;
    }

    .typing-status {
      font-size: 11px;
      font-style: italic;
      color: #38bdf8;
      min-height: 16px;
      padding: 0 4px;
    }

    .send-row {
      display: flex;
      gap: 8px;
    }
    .send-row input { flex: 1; }

    /* Console / Logs */
    .logs-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
    }
    .logs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .logs-content {
      height: 130px;
      background: #070a12;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      overflow-y: auto;
      color: #94a3b8;
    }
    .log-entry { margin-bottom: 3px; }
    .log-entry.customer { color: #93c5fd; }
    .log-entry.expert { color: #86efac; }
    .log-entry.system { color: #cbd5e1; }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="top-header">
    <h1>💬 XprtLink Dual-Card WebSocket Chat Test</h1>
    <p>Live simultaneous Customer ↔ Expert Socket.IO messaging test interface</p>
  </div>

  <!-- Global Controls -->
  <div class="control-panel">
    <div class="ctrl-group">
      <label>Server URL:</label>
      <input id="globalUrl" value="http://localhost:4000" style="width: 180px;" />
      <button class="secondary-btn" onclick="setUrl('http://localhost:4000')">Gateway (:4000)</button>
      <button class="secondary-btn" onclick="setUrl('http://localhost:4005')">Direct (:4005)</button>
    </div>

    <div class="ctrl-group">
      <label>Conversation ID:</label>
      <input id="sharedConvId" value="" placeholder="UUID / Click Create" style="width: 250px;" />
      <button class="primary-btn" onclick="createOrLinkThread()">Create / Link Thread</button>
      <button class="secondary-btn" onclick="connectBoth()">⚡ Connect Both</button>
      <button class="secondary-btn" onclick="joinBoth()">Join Both</button>
    </div>
  </div>

  <!-- Dual Client Cards -->
  <div class="chat-grid">
    
    <!-- Customer Card -->
    <div class="client-card" id="cardCustomer">
      <div class="card-header">
        <div class="card-title customer">
          <span>👤 Customer Client</span>
          <span style="font-size: 12px; color: var(--text-muted); font-weight: normal;">(Jordan Customer)</span>
        </div>
        <span id="custBadge" class="status-badge">Disconnected</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label>Customer JWT Token:</label>
        <input
          id="custToken"
          class="token-box"
          value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjNzE3ZjZlNC0xMDRmLTRhZGUtYjNjMy01ZDE1N2NiMzA2ZDMiLCJyb2xlIjoiY3VzdG9tZXIiLCJjdXN0b21lclByb2ZpbGVJZCI6IjRiOGYyODJmLTMwMTYtNDFiOC05OGY3LTFiOTY3NjM5YjY5YyIsImlhdCI6MTc4NjcwMTgwNCwiZXhwIjoxNzg3MzA2NjA0fQ.JU4t4oMlOYn5h7OvkPDwiQiel6Bcizcw8zuvhlWRBPE"
        />
      </div>

      <div style="display: flex; gap: 8px;">
        <button id="custBtnConnect" class="primary-btn" onclick="connectCust()">Connect</button>
        <button id="custBtnDisconnect" class="secondary-btn" onclick="disconnectCust()" disabled>Disconnect</button>
        <button class="secondary-btn" onclick="listConversationsCust()">My Threads</button>
        <button class="secondary-btn" onclick="joinCust()">Join Room</button>
      </div>

      <!-- Chat Feed -->
      <div id="custChatArea" class="chat-area"></div>
      <div id="custTyping" class="typing-status"></div>

      <!-- Message input -->
      <div class="send-row">
        <input
          id="custMsgInput"
          placeholder="Type message as Customer..."
          oninput="handleTyping('cust')"
          onkeydown="if(event.key==='Enter') sendCustMsg()"
        />
        <button class="primary-btn" onclick="sendCustMsg()">Send</button>
        <button class="secondary-btn" onclick="markReadCust()">Mark Read</button>
      </div>
    </div>

    <!-- Expert Card -->
    <div class="client-card" id="cardExpert">
      <div class="card-header">
        <div class="card-title expert">
          <span>👨‍💼 Expert Client</span>
          <span style="font-size: 12px; color: var(--text-muted); font-weight: normal;">(Jordan Expert)</span>
        </div>
        <span id="expBadge" class="status-badge">Disconnected</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label>Expert JWT Token:</label>
        <input
          id="expToken"
          class="token-box"
          value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2NjAwOWE0Ny04N2EyLTQyYmYtODBhYS1kZTk5YWRkOGFhOGMiLCJyb2xlIjoiZXhwZXJ0IiwiZXhwZXJ0UHJvZmlsZUlkIjoiNTc2OGI3ODctMjYxZC00YzE2LTg2NDAtYjAyODdhMzIyN2Q5IiwiaWF0IjoxNzg2NzAxODA0LCJleHAiOjE3ODczMDY2MDR9.ys_v7Xo0x4aMRzc9gekrkAcSabujbmK9mop0bLiltSc"
        />
      </div>

      <div style="display: flex; gap: 8px;">
        <button id="expBtnConnect" class="primary-btn" style="background: #10b981;" onclick="connectExp()">Connect</button>
        <button id="expBtnDisconnect" class="secondary-btn" onclick="disconnectExp()" disabled>Disconnect</button>
        <button class="secondary-btn" onclick="listConversationsExp()">My Threads</button>
        <button class="secondary-btn" onclick="joinExp()">Join Room</button>
      </div>

      <!-- Chat Feed -->
      <div id="expChatArea" class="chat-area"></div>
      <div id="expTyping" class="typing-status"></div>

      <!-- Message input -->
      <div class="send-row">
        <input
          id="expMsgInput"
          placeholder="Type message as Expert..."
          oninput="handleTyping('exp')"
          onkeydown="if(event.key==='Enter') sendExpMsg()"
        />
        <button class="primary-btn" style="background: #10b981;" onclick="sendExpMsg()">Send</button>
        <button class="secondary-btn" onclick="markReadExp()">Mark Read</button>
      </div>
    </div>

  </div>

  <!-- Realtime Logs -->
  <div class="logs-panel">
    <div class="logs-header">
      <span style="font-size: 13px; font-weight: 600; color: var(--text-muted);">Real-Time Socket Event Stream</span>
      <button class="secondary-btn" style="padding: 4px 10px; font-size: 11px;" onclick="clearLogs()">Clear</button>
    </div>
    <div id="logsBox" class="logs-content"></div>
  </div>

  <script>
    let socketCust = null;
    let socketExp = null;
    let custUserId = "c717f6e4-104f-4ade-b3c3-5d157cb306d3";
    let expUserId = "66009a47-87a2-42bf-80aa-de99add8aa8c";
    let expProfileId = "5768b787-261d-4c16-8640-b0287a3227d9";

    let custTypingTimer = null;
    let expTypingTimer = null;
    let custIsTyping = false;
    let expIsTyping = false;

    function setUrl(url) {
      document.getElementById("globalUrl").value = url;
    }

    function log(actor, msg, data) {
      const box = document.getElementById("logsBox");
      const time = new Date().toLocaleTimeString();
      const line = document.createElement("div");
      line.className = `log-entry ${actor}`;
      line.textContent = `[${time}] [${actor.toUpperCase()}] ${msg} ${data ? JSON.stringify(data) : ""}`;
      box.appendChild(line);
      box.scrollTop = box.scrollHeight;
    }

    function clearLogs() {
      document.getElementById("logsBox").innerHTML = "";
    }

    /* CUSTOMER SOCKET */
    function connectCust() {
      const url = document.getElementById("globalUrl").value.trim();
      const token = document.getElementById("custToken").value.trim();
      if (!token) return alert("Customer token required");

      log("customer", `Connecting to ${url}...`);
      socketCust = io(url, {
        auth: { token },
        transports: ["websocket", "polling"],
      });

      socketCust.on("connect", () => {
        log("customer", `Connected! ID: ${socketCust.id}`);
        document.getElementById("custBadge").className = "status-badge connected";
        document.getElementById("custBadge").textContent = `Connected (${socketCust.id.slice(0, 5)})`;
        document.getElementById("custBtnConnect").disabled = true;
        document.getElementById("custBtnDisconnect").disabled = false;
      });

      socketCust.on("connect_error", (err) => {
        log("customer", `Connect Error: ${err.message}`);
      });

      socketCust.on("disconnect", (reason) => {
        log("customer", `Disconnected: ${reason}`);
        document.getElementById("custBadge").className = "status-badge";
        document.getElementById("custBadge").textContent = "Disconnected";
        document.getElementById("custBtnConnect").disabled = false;
        document.getElementById("custBtnDisconnect").disabled = true;
      });

      socketCust.on("message:new", (data) => {
        log("customer", "Received message:new", data);
        appendMsgTo("cust", data.message, custUserId, "mine-cust");
      });

      socketCust.on("conversation:read", (data) => {
        log("customer", "Received conversation:read", data);
      });

      socketCust.on("conversation:updated", (data) => {
        log("customer", "Inbox alert: conversation:updated", data);
      });

      socketCust.on("typing:status", (data) => {
        const bar = document.getElementById("custTyping");
        bar.textContent = data.isTyping ? "Expert is typing..." : "";
      });
    }

    function disconnectCust() {
      if (socketCust) {
        socketCust.disconnect();
        socketCust = null;
      }
    }

    /* EXPERT SOCKET */
    function connectExp() {
      const url = document.getElementById("globalUrl").value.trim();
      const token = document.getElementById("expToken").value.trim();
      if (!token) return alert("Expert token required");

      log("expert", `Connecting to ${url}...`);
      socketExp = io(url, {
        auth: { token },
        transports: ["websocket", "polling"],
      });

      socketExp.on("connect", () => {
        log("expert", `Connected! ID: ${socketExp.id}`);
        document.getElementById("expBadge").className = "status-badge connected";
        document.getElementById("expBadge").textContent = `Connected (${socketExp.id.slice(0, 5)})`;
        document.getElementById("expBtnConnect").disabled = true;
        document.getElementById("expBtnDisconnect").disabled = false;
      });

      socketExp.on("connect_error", (err) => {
        log("expert", `Connect Error: ${err.message}`);
      });

      socketExp.on("disconnect", (reason) => {
        log("expert", `Disconnected: ${reason}`);
        document.getElementById("expBadge").className = "status-badge";
        document.getElementById("expBadge").textContent = "Disconnected";
        document.getElementById("expBtnConnect").disabled = false;
        document.getElementById("expBtnDisconnect").disabled = true;
      });

      socketExp.on("message:new", (data) => {
        log("expert", "Received message:new", data);
        appendMsgTo("exp", data.message, expUserId, "mine-exp");
      });

      socketExp.on("conversation:read", (data) => {
        log("expert", "Received conversation:read", data);
      });

      socketExp.on("conversation:updated", (data) => {
        log("expert", "Inbox alert: conversation:updated", data);
      });

      socketExp.on("typing:status", (data) => {
        const bar = document.getElementById("expTyping");
        bar.textContent = data.isTyping ? "Customer is typing..." : "";
      });
    }

    function disconnectExp() {
      if (socketExp) {
        socketExp.disconnect();
        socketExp = null;
      }
    }

    /* BATCH OPERATIONS */
    function connectBoth() {
      connectCust();
      connectExp();
    }

    function createOrLinkThread() {
      if (!socketCust) {
        alert("Please connect Customer socket first");
        return;
      }
      log("customer", "Creating/getting conversation with expert...");
      socketCust.emit("conversation:create", { expertId: expProfileId }, (res) => {
        log("customer", "conversation:create response", res);
        if (res.success && res.data?.id) {
          document.getElementById("sharedConvId").value = res.data.id;
          joinBoth();
        }
      });
    }

    function joinBoth() {
      joinCust();
      joinExp();
    }

    function joinCust() {
      const convId = document.getElementById("sharedConvId").value.trim();
      if (!socketCust || !convId) return;
      socketCust.emit("conversation:join", { conversationId: convId }, (res) => {
        log("customer", "conversation:join", res);
        if (res.success) loadHistory("cust", convId, custUserId, "mine-cust");
      });
    }

    function joinExp() {
      const convId = document.getElementById("sharedConvId").value.trim();
      if (!socketExp || !convId) return;
      socketExp.emit("conversation:join", { conversationId: convId }, (res) => {
        log("expert", "conversation:join", res);
        if (res.success) loadHistory("exp", convId, expUserId, "mine-exp");
      });
    }

    function loadHistory(actor, convId, myId, myClass) {
      const s = actor === "cust" ? socketCust : socketExp;
      s.emit("message:history", { conversationId: convId, page: 1, limit: 50 }, (res) => {
        if (res.success) {
          const area = document.getElementById(actor + "ChatArea");
          area.innerHTML = "";
          (res.data.items || []).reverse().forEach((msg) => {
            appendMsgTo(actor, msg, myId, myClass);
          });
        }
      });
    }

    function listConversationsCust() {
      if (!socketCust) return alert("Connect Customer first");
      socketCust.emit("conversation:list", {}, (res) => {
        log("customer", "conversation:list", res);
        if (res.success && res.data?.items?.length > 0) {
          document.getElementById("sharedConvId").value = res.data.items[0].id;
        }
      });
    }

    function listConversationsExp() {
      if (!socketExp) return alert("Connect Expert first");
      socketExp.emit("conversation:list", {}, (res) => {
        log("expert", "conversation:list", res);
        if (res.success && res.data?.items?.length > 0) {
          document.getElementById("sharedConvId").value = res.data.items[0].id;
        }
      });
    }

    function sendCustMsg() {
      const input = document.getElementById("custMsgInput");
      const convId = document.getElementById("sharedConvId").value.trim();
      const body = input.value.trim();
      if (!socketCust || !convId || !body) return;

      socketCust.emit("message:send", { conversationId: convId, body }, (res) => {
        log("customer", "message:send", res);
        if (res.success) {
          input.value = "";
          handleTyping("cust", true);
        }
      });
    }

    function sendExpMsg() {
      const input = document.getElementById("expMsgInput");
      const convId = document.getElementById("sharedConvId").value.trim();
      const body = input.value.trim();
      if (!socketExp || !convId || !body) return;

      socketExp.emit("message:send", { conversationId: convId, body }, (res) => {
        log("expert", "message:send", res);
        if (res.success) {
          input.value = "";
          handleTyping("exp", true);
        }
      });
    }

    function markReadCust() {
      const convId = document.getElementById("sharedConvId").value.trim();
      if (!socketCust || !convId) return;
      socketCust.emit("message:read", { conversationId: convId }, (res) => {
        log("customer", "message:read", res);
      });
    }

    function markReadExp() {
      const convId = document.getElementById("sharedConvId").value.trim();
      if (!socketExp || !convId) return;
      socketExp.emit("message:read", { conversationId: convId }, (res) => {
        log("expert", "message:read", res);
      });
    }

    function handleTyping(actor, forceStop = false) {
      const convId = document.getElementById("sharedConvId").value.trim();
      const s = actor === "cust" ? socketCust : socketExp;
      if (!s || !convId) return;

      if (actor === "cust") {
        if (forceStop) {
          if (custIsTyping) { s.emit("typing:stop", { conversationId: convId }); custIsTyping = false; }
          return;
        }
        if (!custIsTyping) {
          s.emit("typing:start", { conversationId: convId });
          custIsTyping = true;
        }
        clearTimeout(custTypingTimer);
        custTypingTimer = setTimeout(() => {
          s.emit("typing:stop", { conversationId: convId });
          custIsTyping = false;
        }, 2000);
      } else {
        if (forceStop) {
          if (expIsTyping) { s.emit("typing:stop", { conversationId: convId }); expIsTyping = false; }
          return;
        }
        if (!expIsTyping) {
          s.emit("typing:start", { conversationId: convId });
          expIsTyping = true;
        }
        clearTimeout(expTypingTimer);
        expTypingTimer = setTimeout(() => {
          s.emit("typing:stop", { conversationId: convId });
          expIsTyping = false;
        }, 2000);
      }
    }

    function appendMsgTo(actor, msg, myId, myClass) {
      const area = document.getElementById(actor + "ChatArea");
      const isMine = msg.senderUserId === myId;
      const bubble = document.createElement("div");
      bubble.className = `msg-bubble ${isMine ? myClass : "theirs"}`;
      bubble.innerHTML = `
        <div>${escapeHtml(msg.body || "[Attachment]")}</div>
        <div class="msg-meta">${new Date(msg.createdAt).toLocaleTimeString()} • ${msg.deliveryStatus}</div>
      `;
      area.appendChild(bubble);
      area.scrollTop = area.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Auto load thread if available
    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("sharedConvId").value = "a6e13d67-1c28-4e73-a22f-c15ec9a2684b";
    });
  </script>
</body>
</html>
